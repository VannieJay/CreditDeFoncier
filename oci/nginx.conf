# /etc/nginx/sites-available/creditdefoncier — reverse-proxy to the Express app (co-host)
# Co-exists with ollama-gateway.conf (:8080) and wa-transfer (:3001) on 140.238.79.76.
# After `sudo nginx -t && sudo systemctl reload nginx`, certbot will add the
# SSL stanzas (`listen 443 ssl; ...`). Keep the 80 block for the ACME challenge
# and the Let's Encrypt redirect.
server {
    listen 80;
    listen [::]:80;
    server_name creditdefoncier.com www.creditdefoncier.com;

    # ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
    }
}
